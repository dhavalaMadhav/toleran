<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Engineering Drawing Intelligence</title>
  
  <!-- Modern Engineering Typography (Swiss Precision) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Outline Icon Family -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-secondary); padding: 1.5rem;">
  <div class="card" style="width: 100%; max-width: 400px; padding: 2.25rem 2rem; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 0.85rem; width: 36px; height: 36px; font-size: 1.15rem;">Δ</div>
      <h2 style="font-size: 1.25rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em;">CAD Intelligence</h2>
      <p style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.25rem;">Design Compliance & Dimension Copilot</p>
    </div>

    <form onsubmit="handleDemoLogin(event)">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Engineer email</label>
        <input type="email" id="loginEmail" class="form-control" value="engineer@cadcopilot.internal" required>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" class="form-control" value="admin123" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem;">
        <span>Sign in to workspace</span>
        <i data-lucide="arrow-right"></i>
      </button>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.76rem; color: var(--text-muted);">
        Authenticated local engineering session enabled.
      </div>
    </form>
  </div>

  <script src="/static/js/main.js"></script>
  <script>
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
    function handleDemoLogin(e) {
      e.preventDefault();
      window.location.href = '/dashboard';
    }
  </script>
</body>
</html>
